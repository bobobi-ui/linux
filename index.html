<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Linux 隨機練習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<style>
/* Layout: one centered column. Setup screen, then one question card at a time, then a review list.
   Palette borrows Ubuntu's aubergine and orange; mono face is used for commands and labels. */
:root {
  --bg: #f3f0f3;
  --surface: #ffffff;
  --ink: #2b1826;
  --muted: #6b5766;
  --line: #ddd2d9;
  --accent: #772953;
  --accent-ink: #ffffff;
  --accent-soft: #f1e3ea;
  --orange: #e95420;
  --code: #ece4ea;
  --good: #1d7443;
  --good-bg: #e4f3ea;
  --bad: #b3261e;
  --bad-bg: #fbe8e6;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1018; --surface: #281723; --ink: #f4eaf0; --muted: #b9a3b1; --line: #4b3345;
    --accent: #e68fbd; --accent-ink: #2a1020; --accent-soft: #3d2336; --orange: #ff7f4d;
    --code: #3a2634; --good: #6fd39a; --good-bg: #17382a; --bad: #ff9a8c; --bad-bg: #44211f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1018; --surface: #281723; --ink: #f4eaf0; --muted: #b9a3b1; --line: #4b3345;
  --accent: #e68fbd; --accent-ink: #2a1020; --accent-soft: #3d2336; --orange: #ff7f4d;
  --code: #3a2634; --good: #6fd39a; --good-bg: #17382a; --bad: #ff9a8c; --bad-bg: #44211f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
main { max-width: 720px; margin: 0 auto; display: grid; gap: 22px; }
section { display: grid; gap: 22px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
code {
  font-family: var(--font-mono); font-size: 0.88em; background: var(--code);
  padding: 0.1em 0.4em; border-radius: 4px; overflow-wrap: anywhere;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

.brand { font-family: var(--font-mono); font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.brand b { color: var(--orange); font-weight: 600; }
h1 { font-size: clamp(28px, 6vw, 38px); font-weight: 800; line-height: 1.25; }
.lede { color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; }
.label { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.04em; color: var(--muted); }

.chips { display: grid; gap: 8px; }
.chip, .seg { position: relative; display: block; }
.chip input, .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span {
  display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--bg);
}
.chip span i { font-style: normal; font-family: var(--font-mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.chip input:checked + span { border-color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.chip input:focus-visible + span, .seg input:focus-visible + span { outline: 3px solid var(--orange); outline-offset: 2px; }
.chip span b { font-weight: inherit; }
.chip span b::before { content: "☐ "; color: var(--muted); font-family: var(--font-mono); }
.chip input:checked + span b::before { content: "☑ "; color: var(--accent); }

.segs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.seg span {
  display: block; text-align: center; border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 4px; background: var(--bg); font-family: var(--font-mono);
}
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  border-radius: 8px; padding: 12px 20px; font-weight: 700; text-align: center;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 180px; }

/* quiz */
.topbar { display: grid; gap: 8px; }
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--orange); transition: width 0.25s ease; }
@media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
.tag { font-family: var(--font-mono); font-size: 12px; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 10px; justify-self: start; }
.qtext { font-size: 19px; font-weight: 700; line-height: 1.6; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left;
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px;
}
.opt .k { font-family: var(--font-mono); font-weight: 600; color: var(--accent); }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt .t small { display: block; font-family: var(--font-mono); font-size: 12px; margin-top: 2px; }
.opt:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .k, .opt.right small { color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .k, .opt.wrong small { color: var(--bad); }
.opt.dim { opacity: 0.6; }
.explain { border-left: 4px solid var(--orange); background: var(--bg); padding: 12px 14px; border-radius: 0 8px 8px 0; }
.explain strong { display: block; font-size: 14px; margin-bottom: 2px; }
.explain.ok strong { color: var(--good); }
.explain.no strong { color: var(--bad); }
.hint { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

/* result */
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score b { font-family: var(--font-mono); font-size: 56px; line-height: 1; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.score span { color: var(--muted); }
.review { display: grid; gap: 14px; }
.rv { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 6px; }
.rv .q { font-weight: 700; }
.rv .a { font-size: 15px; overflow-wrap: anywhere; }
.rv .a .bad { color: var(--bad); }
.rv .a .good { color: var(--good); }
.rv .e { font-size: 14px; color: var(--muted); }
@media (max-width: 480px) { .qtext { font-size: 17px; } .panel { padding: 16px; } }
</style>

<main>
  <div class="brand"><b>$</b><span>linux-quiz --random</span></div>

  <section id="v-home" class="home">
    <div style="display:grid;gap:10px">
      <h1>Linux 隨機練習</h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="panel">
      <div class="label">選擇章節</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="panel">
      <div class="label">題數</div>
      <div class="segs" id="segs"></div>
    </div>
    <div class="row">
      <button class="btn" id="go" type="button">開始隨機練習</button>
      <button class="btn ghost" id="goWrong" type="button" hidden>練習錯題本</button>
    </div>
    <p class="hint">每次開始都會重新抽題並打亂選項順序。作答時可按 1–4 或 A–D 選擇，按 Enter 進入下一題。</p>
  </section>

  <section id="v-quiz" hidden>
    <div class="topbar">
      <div class="meta"><span id="pos"></span><span id="sc"></span></div>
      <div class="bar"><div id="prog"></div></div>
    </div>
    <div class="panel">
      <span class="tag" id="qtag"></span>
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <div class="explain" id="exp" hidden></div>
    </div>
    <div class="row">
      <button class="btn" id="next" type="button" hidden>下一題</button>
      <button class="btn ghost" id="quit" type="button">結束並回首頁</button>
    </div>
  </section>

  <section id="v-result" hidden>
    <div class="panel">
      <div class="label">本輪結果</div>
      <div class="score"><b id="rscore"></b><span id="rpct"></span></div>
      <p id="rmsg"></p>
    </div>
    <div class="row">
      <button class="btn" id="again" type="button">再抽一輪</button>
      <button class="btn" id="retryWrong" type="button" hidden>重做本輪錯題</button>
      <button class="btn ghost" id="home" type="button">回首頁</button>
    </div>
    <div class="panel" id="rvbox" hidden>
      <div class="label">答錯的題目</div>
      <div class="review" id="review"></div>
    </div>
  </section>
</main>

  [5,"在命令列直接寫入密碼，風險不包含下列哪一項？","它會自動讓所有使用者都得到管理權限",["可能留在歷史紀錄","可能出現在程序資訊","可能被錄影畫面拍到"],"講義提到歷史紀錄、程序資訊與錄影畫面等風險。"],
  [5,"依本章小結，各符號的用途對應正確的是？","Pipe 與 grep 做文字處理；`sudo tee` 處理需權限的寫入；`&&` 與 `||` 依離開狀態控制下一個指令",["Pipe 管理背景工作；`&&` 處理檔案權限","`sudo tee` 做文字搜尋；`grep` 管理工作","`&` 控制離開狀態；`||` 建立檔案"],"`&`、`jobs`、`bg`、`fg` 則是管理目前 Shell 的工作。"]
  ];

  /* ---------- helpers ---------- */
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function fmt(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  var KEY = "linuxquiz.wrongbook.v1";
  var wrongBook = [];
  try { wrongBook = JSON.parse(localStorage.getItem(KEY) || "[]") || []; } catch (e) { wrongBook = []; }
  function saveWrong() { try { localStorage.setItem(KEY, JSON.stringify(wrongBook)); } catch (e) {} }

  var counts = [0, 0, 0, 0, 0, 0];
  Q.forEach(function (q) { counts[q[0]]++; });

  var S = { pool: [], i: 0, score: 0, done: false, missed: [], lastCount: 10, wrongMode: false };

  /* ---------- home ---------- */
  var chipsEl = $("chips");
  CH.forEach(function (name, k) {
    var n = k + 1;
    var l = document.createElement("label");
    l.className = "chip";
    l.innerHTML = '<input type="checkbox" id="ch' + n + '" value="' + n + '" checked><span><b>第 ' + n + ' 章　' + esc(name) + '</b><i>' + counts[n] + ' 題</i></span>';
    chipsEl.appendChild(l);
  });
  var segsEl = $("segs");
  [["10", "10 題"], ["20", "20 題"], ["30", "30 題"], ["all", "全部"]].forEach(function (p, k) {
    var l = document.createElement("label");
    l.className = "seg";
    l.innerHTML = '<input type="radio" name="cnt" id="cnt' + k + '" value="' + p[0] + '"' + (k === 1 ? " checked" : "") + '><span>' + p[1] + '</span>';
    segsEl.appendChild(l);
  });
  $("lede").textContent = "題庫共 " + Q.length + " 題，整理自五份 Ubuntu 22.04 講義。每次練習都隨機抽題、打亂選項，答完立刻看解析。";

  function selectedChapters() {
    var r = [];
    for (var n = 1; n <= 5; n++) if ($("ch" + n).checked) r.push(n);
    return r;
  }
  function selectedCount() {
    var v = document.querySelector('input[name="cnt"]:checked').value;
    return v === "all" ? Infinity : parseInt(v, 10);
  }
  function refreshHome() {
    $("go").disabled = selectedChapters().length === 0;
    var wb = $("goWrong");
    wb.hidden = wrongBook.length === 0;
    wb.textContent = "練習錯題本（" + wrongBook.length + " 題）";
  }
  chipsEl.addEventListener("change", refreshHome);

  function show(id) {
    ["v-home", "v-quiz", "v-result"].forEach(function (v) { $(v).hidden = v !== id; });
    window.scrollTo(0, 0);
  }

  /* ---------- quiz flow ---------- */
  function begin(ids, wrongMode) {
    S.pool = shuffle(ids).map(function (id) {
      var q = Q[id];
      var opts = shuffle([{ t: q[2], ok: true }].concat(q[3].map(function (w) { return { t: w, ok: false }; })));
      return { id: id, q: q[1], opts: opts, exp: q[4], ch: q[0] };
    });
    S.i = 0; S.score = 0; S.missed = []; S.wrongMode = !!wrongMode;
    show("v-quiz");
    renderQ();
  }
  function startRandom() {
    var chs = selectedChapters();
    var ids = [];
    Q.forEach(function (q, id) { if (chs.indexOf(q[0]) >= 0) ids.push(id); });
    var n = selectedCount();
    S.lastCount = n;
    ids = shuffle(ids).slice(0, Math.min(n, ids.length));
    begin(ids, false);
  }

  var LETTERS = ["A", "B", "C", "D"];
  function renderQ() {
    var p = S.pool[S.i];
    S.done = false;
    $("pos").textContent = "第 " + (S.i + 1) + " / " + S.pool.length + " 題";
    $("sc").textContent = "答對 " + S.score;
    $("prog").style.width = (S.i / S.pool.length * 100) + "%";
    $("qtag").textContent = "第 " + p.ch + " 章 · " + CH[p.ch - 1];
    $("qtext").innerHTML = fmt(p.q);
    var o = $("opts");
    o.innerHTML = "";
    p.opts.forEach(function (op, k) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      b.innerHTML = '<span class="k">' + LETTERS[k] + '</span><span class="t">' + fmt(op.t) + '</span>';
      b.addEventListener("click", function () { answer(k); });
      o.appendChild(b);
    });
    $("exp").hidden = true;
    $("next").hidden = true;
  }
  function answer(k) {
    if (S.done) return;
    S.done = true;
    var p = S.pool[S.i];
    var ok = p.opts[k].ok;
    var btns = $("opts").children;
    for (var j = 0; j < btns.length; j++) {
      var b = btns[j];
      b.disabled = true;
      var t = b.querySelector(".t");
      if (p.opts[j].ok) { b.classList.add("right"); t.insertAdjacentHTML("beforeend", "<small>✓ 正確答案</small>"); }
      else if (j === k) { b.classList.add("wrong"); t.insertAdjacentHTML("beforeend", "<small>✗ 你的答案</small>"); }
      else b.classList.add("dim");
    }
    if (ok) {
      S.score++;
      var at = wrongBook.indexOf(p.id);
      if (at >= 0) { wrongBook.splice(at, 1); saveWrong(); }
    } else {
      S.missed.push({ p: p, picked: p.opts[k].t });
      if (wrongBook.indexOf(p.id) < 0) { wrongBook.push(p.id); saveWrong(); }
    }
    $("sc").textContent = "答對 " + S.score;
    $("prog").style.width = ((S.i + 1) / S.pool.length * 100) + "%";
    var e = $("exp");
    e.className = "explain " + (ok ? "ok" : "no");
    e.innerHTML = "<strong>" + (ok ? "答對了" : "答錯了") + "</strong>" + fmt(p.exp);
    e.hidden = false;
    var nx = $("next");
    nx.textContent = S.i + 1 < S.pool.length ? "下一題" : "查看結果";
    nx.hidden = false;
    nx.focus({ preventScroll: true });
  }
  function nextQ() {
    if (!S.done) return;
    if (S.i + 1 < S.pool.length) { S.i++; renderQ(); window.scrollTo(0, 0); }
    else finish();
  }

  /* ---------- result ---------- */
  function finish() {
    var total = S.pool.length;
    var pct = Math.round(S.score / total * 100);
    $("rscore").textContent = S.score + " / " + total;
    $("rpct").textContent = "答對率 " + pct + "%";
    $("rmsg").textContent = pct === 100 ? "全部答對，可以換一批題目再練一次。"
      : pct >= 80 ? "掌握得不錯，看看下面答錯的題目補強即可。"
      : pct >= 60 ? "有基礎了，建議把答錯的題目對照講義再讀一次。"
      : "還需要加強，先看下面的解析，再重做錯題。";
    var rv = $("review");
    rv.innerHTML = "";
    S.missed.forEach(function (m) {
      var d = document.createElement("div");
      d.className = "rv";
      var right = m.p.opts.filter(function (o) { return o.ok; })[0].t;
      d.innerHTML = '<div class="label">第 ' + m.p.ch + ' 章 · ' + esc(CH[m.p.ch - 1]) + '</div>' +
        '<div class="q">' + fmt(m.p.q) + '</div>' +
        '<div class="a"><span class="bad">✗ 你的答案：</span>' + fmt(m.picked) + '</div>' +
        '<div class="a"><span class="good">✓ 正確答案：</span>' + fmt(right) + '</div>' +
        '<div class="e">' + fmt(m.p.exp) + '</div>';
      rv.appendChild(d);
    });
    $("rvbox").hidden = S.missed.length === 0;
    $("retryWrong").hidden = S.missed.length === 0;
    $("again").textContent = S.wrongMode ? "回到隨機練習" : "再抽一輪";
    show("v-result");
  }

  /* ---------- wiring ---------- */
  $("go").addEventListener("click", startRandom);
  $("goWrong").addEventListener("click", function () { begin(wrongBook.slice(), true); });
  $("next").addEventListener("click", nextQ);
  $("quit").addEventListener("click", function () { refreshHome(); show("v-home"); });
  $("home").addEventListener("click", function () { refreshHome(); show("v-home"); });
  $("again").addEventListener("click", function () {
    if (S.wrongMode) { refreshHome(); show("v-home"); } else startRandom();
  });
  $("retryWrong").addEventListener("click", function () {
    begin(S.missed.map(function (m) { return m.p.id; }), false);
  });
  document.addEventListener("keydown", function (e) {
    if ($("v-quiz").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase();
    var idx = "1234".indexOf(k);
    if (idx < 0) idx = "abcd".indexOf(k);
    if (idx >= 0 && idx < S.pool[S.i].opts.length && !S.done) { answer(idx); e.preventDefault(); return; }
    if ((e.key === "Enter" || e.key === "ArrowRight") && S.done) { nextQ(); e.preventDefault(); }
  });

  refreshHome();
  show("v-home");
})();
</script>
